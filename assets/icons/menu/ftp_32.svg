<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Left Controller -->
  <!-- Rounded corners on left side, flat on right -->
  <!-- x: 2-12, y: 2-30 -->
  <path d="M12 2H6a4 4 0 0 0-4 4v20a4 4 0 0 0 4 4h6V2z" />
  
  <!-- Left Stick -->
  <circle cx="7" cy="9" r="2" stroke="white" fill="white" />
  <!-- Left Buttons (D-pad) -->
  <path d="M7 19v4" />
  <path d="M5 21h4" />

  <!-- Right Controller -->
  <!-- Rounded corners on right side, flat on left -->
  <!-- x: 20-30, y: 2-30 -->
  <path d="M20 2h6a4 4 0 0 1 4 4v20a4 4 0 0 1-4 4h-6V2z" />
  
  <!-- Right Stick -->
  <circle cx="25" cy="21" r="2" stroke="white" fill="white" />
  <!-- Right Buttons (ABXY) -->
  <circle cx="25" cy="9" r="1.5" />
</svg>
